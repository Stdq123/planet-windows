version: 2
# Dependency update proposals are enabled independently of the paused build CI.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    commit-message:
      prefix: chore
  - package-ecosystem: gomod
    directory: /windows
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    commit-message:
      prefix: chore
  - package-ecosystem: bun
    directory: /windows
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    commit-message:
      prefix: chore
