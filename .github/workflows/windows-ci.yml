name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows quality checks
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.5'
      - name: Classify changed files
        id: scope
        run: bun ../scripts/check-changes.ts ci
      - name: Check documentation
        if: steps.scope.outputs.mode == 'docs'
        run: bun run check:docs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.mode != 'docs'
        with:
          go-version-file: windows/go.mod
          cache-dependency-path: windows/go.sum
      - name: Install locked dependencies
        if: steps.scope.outputs.mode != 'docs'
        run: bun install --frozen-lockfile
      - name: Run shared quality checks
        if: steps.scope.outputs.mode != 'docs'
        run: bun run check
      - name: Audit dependencies
        if: steps.scope.outputs.mode != 'docs'
        run: bun run security:check
